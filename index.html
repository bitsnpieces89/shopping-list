<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopping list</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9EDE6">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9EDE6;
    --surface: #FBFCFA;
    --ink: #17231C;
    --muted: #6E7C71;
    --line: #D8DFD4;
    --accent: #2F6B4A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 460px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { padding: calc(22px + env(safe-area-inset-top)) 18px 10px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .tally { margin: 6px 0 0; font-size: 14px; color: var(--muted); }

  main { flex: 1; overflow-y: auto; padding: 6px 14px 110px; }

  h2 { margin: 6px 4px 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  h2.rest { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(102px, 1fr));
    gap: 8px;
  }

  .card {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none; /* stops iOS's own long-press menu */
    min-height: 68px;
    padding: 10px 8px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.25;
    display: grid;
    place-items: center;
    text-align: center;
    overflow-wrap: anywhere;
    transition: transform 120ms ease, background 120ms ease;
  }
  .card.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .card:active { transform: scale(0.96); }
  .card.flash { animation: pop 700ms ease-out; }
  @keyframes pop {
    0%   { box-shadow: 0 0 0 0 rgba(47,107,74,.45); }
    100% { box-shadow: 0 0 0 12px rgba(47,107,74,0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .card.flash { transition: none; animation: none; }
    .card:active { transform: none; }
  }

  .card.editing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

  .hint { color: var(--muted); font-size: 14px; margin: 0; padding: 6px 4px 2px; }
  .gesture { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: rgba(23, 35, 28, .38);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    animation: fade 140ms ease-out;
  }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .overlay { animation: none; } }

  .panel {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 16px 16px;
  }
  .panel h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
  .panel .was { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
  .panel input { width: 100%; margin-bottom: 12px; }
  .warn { margin: -6px 0 12px; font-size: 13px; color: #A33A2A; }
  .btnRow { display: flex; gap: 8px; }
  .btnRow > * { flex: 1; padding: 0; }

  .bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 62%, rgba(233,237,230,0));
  }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1;
    min-width: 0;
    min-height: 52px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--surface);
    font: inherit;
    font-size: 16px; /* keeps iOS from zooming on focus */
    color: var(--ink);
  }
  input::placeholder { color: var(--muted); }
  .primary {
    width: 100%;
    min-height: 52px;
    border: none;
    border-radius: 13px;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
  }
  .primary.tight { width: auto; padding: 0 20px; flex: none; }
  .ghost {
    flex: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 13px;
    padding: 0 14px;
    min-height: 52px;
    font-size: 15px;
    font-weight: 600;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>This week</h1>
    <p class="tally" id="tally"></p>
    <p class="gesture">Tap to move · hold to rename</p>
  </header>

  <main>
    <h2>Buying</h2>
    <div class="grid" id="activeGrid"></div>
    <p class="hint hidden" id="activeEmpty">Nothing selected. Tap anything below to add it to this trip.</p>

    <h2 class="rest">Not this week</h2>
    <div class="grid" id="idleGrid"></div>
    <p class="hint hidden" id="idleEmpty">Everything you know about is on the list.</p>
  </main>

  <div class="bar">
    <button class="primary" id="addBtn">Add item</button>
    <div class="row hidden" id="addRow">
      <input id="draft" placeholder="New item" autocomplete="off" autocapitalize="words">
      <button class="primary tight" id="saveBtn">Add</button>
      <button class="ghost" id="doneBtn">Done</button>
    </div>
  </div>

  <div class="overlay hidden" id="renameOverlay" role="dialog" aria-modal="true" aria-labelledby="renameHead">
    <div class="panel">
      <h3 id="renameHead">Rename item</h3>
      <p class="was" id="renameWas"></p>
      <input id="renameInput" autocomplete="off" autocapitalize="words" aria-label="New name">
      <p class="warn hidden" id="renameWarn"></p>
      <div class="btnRow">
        <button class="ghost" id="renameCancel">Cancel</button>
        <button class="primary" id="renameSave">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
// ---- storage -------------------------------------------------------------
const KEY = 'shoplist-v1';

const SEED = ['Milk','Bread','Eggs','Butter','Coffee','Bananas','Tomatoes',
  'Onions','Potatoes','Chicken','Pasta','Rice','Olive oil','Yoghurt',
  'Cheese','Dish soap','Toilet paper'];

const uid  = () => Math.random().toString(36).slice(2, 10);
const norm = s => s.trim().toLowerCase();

let items = [];

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    items = (parsed && Array.isArray(parsed.items) && parsed.items.length)
      ? parsed.items
      : SEED.map(name => ({ id: uid(), name, needed: false }));
  } catch (e) {
    console.error('Could not read saved list:', e);
    items = SEED.map(name => ({ id: uid(), name, needed: false }));
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ items }));
  } catch (e) {
    console.error('Could not save list:', e);
  }
}

// ---- rendering -----------------------------------------------------------
const el = id => document.getElementById(id);
const byName = (a, b) => a.name.localeCompare(b.name);

function cardFor(item) {
  const b = document.createElement('button');
  b.className = 'card' + (item.needed ? ' on' : '');
  b.textContent = item.name;
  b.dataset.id = item.id;
  b.setAttribute('aria-pressed', String(item.needed));
  return b;
}

function render(flashId) {
  const active = items.filter(i => i.needed).sort(byName);
  const idle   = items.filter(i => !i.needed).sort(byName);

  el('tally').textContent = active.length + ' of ' + items.length + ' selected';

  for (const [grid, list, empty] of [
    [el('activeGrid'), active, el('activeEmpty')],
    [el('idleGrid'),   idle,   el('idleEmpty')],
  ]) {
    grid.replaceChildren(...list.map(cardFor));
    empty.classList.toggle('hidden', list.length > 0);
  }

  if (flashId) {
    const node = document.querySelector('.card[data-id="' + flashId + '"]');
    if (node) {
      node.classList.add('flash');
      node.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}

// ---- tap to move, hold to rename ----------------------------------------
const HOLD_MS = 500;   // how long a press must last to count as a hold
const SLOP_PX = 10;    // finger movement past this = a scroll, not a press

const main = document.querySelector('main');
let holdTimer = null, holdAt = 0, startX = 0, startY = 0;

function stopTimer() {
  clearTimeout(holdTimer);
  holdTimer = null;
}

main.addEventListener('pointerdown', e => {
  const card = e.target.closest('.card');
  if (!card || e.button > 0) return;
  startX = e.clientX;
  startY = e.clientY;
  const id = card.dataset.id;
  holdTimer = setTimeout(() => {
    holdTimer = null;
    holdAt = Date.now();
    if (navigator.vibrate) navigator.vibrate(15);
    openRename(id);
  }, HOLD_MS);
});

main.addEventListener('pointermove', e => {
  if (!holdTimer) return;
  if (Math.abs(e.clientX - startX) > SLOP_PX ||
      Math.abs(e.clientY - startY) > SLOP_PX) stopTimer();
});

['pointerup', 'pointercancel', 'pointerleave'].forEach(evt =>
  main.addEventListener(evt, stopTimer)
);

main.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  // a hold just fired, so swallow the click it drags along behind it
  if (Date.now() - holdAt < 700) return;
  const item = items.find(i => i.id === card.dataset.id);
  if (!item) return;
  item.needed = !item.needed;
  save();
  render();
});

// right-click renames too, and this suppresses the browser menu on hold
main.addEventListener('contextmenu', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  e.preventDefault();
  stopTimer();
  holdAt = Date.now();
  openRename(card.dataset.id);
});

// ---- rename --------------------------------------------------------------
let renamingId = null;

function openRename(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  renamingId = id;
  el('renameWas').textContent = 'Currently “' + item.name + '”';
  el('renameInput').value = item.name;
  el('renameWarn').classList.add('hidden');
  el('renameOverlay').classList.remove('hidden');
  document.querySelector('.card[data-id="' + id + '"]')?.classList.add('editing');
  const input = el('renameInput');
  input.focus();
  input.select();
}

function closeRename() {
  el('renameOverlay').classList.add('hidden');
  renamingId = null;
  render();
}

function commitRename() {
  const item = items.find(i => i.id === renamingId);
  if (!item) return closeRename();
  const name = el('renameInput').value.trim();
  if (!name) return closeRename();          // emptied it: leave the name alone
  if (name === item.name) return closeRename();

  const clash = items.find(i => i.id !== item.id && norm(i.name) === norm(name));
  if (clash) {
    const warn = el('renameWarn');
    warn.textContent = 'You already have an item called “' + clash.name + '”.';
    warn.classList.remove('hidden');
    return;
  }
  item.name = name;
  save();
  closeRename();
}

el('renameSave').addEventListener('click', commitRename);
el('renameCancel').addEventListener('click', closeRename);

el('renameOverlay').addEventListener('click', e => {
  if (e.target === el('renameOverlay')) closeRename();  // tap the dimmed area
});

el('renameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') commitRename();
  if (e.key === 'Escape') closeRename();
});

function addItem() {
  const name = el('draft').value.trim();
  if (!name) return;
  const hit = items.find(i => norm(i.name) === norm(name));
  let id;
  if (hit) {
    hit.needed = true;          // already known: just move it up
    id = hit.id;
  } else {
    const item = { id: uid(), name, needed: true };
    items.push(item);
    id = item.id;
  }
  el('draft').value = '';
  save();
  render(id);
  el('draft').focus();
}

el('addBtn').addEventListener('click', () => {
  el('addBtn').classList.add('hidden');
  el('addRow').classList.remove('hidden');
  el('draft').focus();
});

el('doneBtn').addEventListener('click', () => {
  el('addRow').classList.add('hidden');
  el('addBtn').classList.remove('hidden');
  el('draft').value = '';
});

el('saveBtn').addEventListener('click', addItem);

el('draft').addEventListener('keydown', e => {
  if (e.key === 'Enter') addItem();
  if (e.key === 'Escape') el('doneBtn').click();
});

// ---- go ------------------------------------------------------------------
load();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err =>
      console.log('Offline mode unavailable:', err)
    );
  });
}
</script>
</body>
</html>
